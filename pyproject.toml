[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-permission-linter"
version = "0.1.0.dev0"
description = "Detect AI agents holding more power than their declared task needs."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
apl = "apl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
