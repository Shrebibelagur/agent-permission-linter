name: docs-assistant
purpose: Personal assistant that answers questions from internal docs and opens a ticket when the docs do not cover it.
owner: alice@contoso.example
data_classification: internal
invokers: single
servers:
  - server: docs
    required_capabilities: [read]
    justification: Search and read documentation pages.
  - server: tickets
    required_capabilities: [read, write]
    justification: Check for duplicates, then create one ticket.
